apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: cgroupfs
failSwapOn: false

# Container runtime
containerRuntimeEndpoint: "unix:///run/containerd/containerd.sock"

# Static pods
staticPodPath: "/etc/kubernetes/manifests"

# TLS Bootstrap - enables kubelet to join cluster via bootstrap token
serverTLSBootstrap: true
rotateCertificates: true

# Authentication
authentication:
  # Note: clientCAFile is not set here because the CA cert is written during bootstrap
  # The kubelet will use the CA from the kubeconfig instead
  anonymous:
    enabled: false  # Security: disable anonymous access
  webhook:
    enabled: false

# Authorization
# Security: Use Webhook mode to delegate authorization decisions to the API server.
# AlwaysAllow is insecure because it grants any authenticated request full access
# to all kubelet endpoints (exec, logs, metrics), bypassing RBAC entirely.
authorization:
  mode: Webhook

# TLS Certificate Configuration
# Note: tlsCertFile and tlsPrivateKeyFile are not set here.
# - For client auth: uses certificates from --bootstrap-kubeconfig / --kubeconfig
# - For server HTTPS: kubelet auto-generates self-signed certs on first run
# The bootstrap process will create proper client certificates via CSR approval

# Cluster configuration
clusterDomain: cluster.local
clusterDNS:
  - 10.96.0.10  # Default Kubernetes CoreDNS service IP

# Security: Disable the read-only port (10255) which exposes unauthenticated
# metrics and health endpoints. Setting to 0 disables it entirely, forcing all
# access through the authenticated HTTPS port (10250) instead.
readOnlyPort: 0
