[workspace]
members = [
    "cmd/keel-init",
    "pkg/api",
    "cmd/keel-agent",
    "cmd/osctl",
    "pkg/crypto",
    "pkg/config",
    # "pkg/init",        # Future
    # "pkg/init",        # Future
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KeelOS Maintainers"]
license = "Apache-2.0"
repository = "https://github.com/scheeles/keelos"

[workspace.dependencies]
bsdiff = "0.2"

[workspace.lints.rust]
# Deny unsafe code by default (can be overridden in specific crates if needed)
unsafe_code = "warn"
# TODO(#132): raise back to "warn" once public items are documented.
# 170 of the ~171 current violations are in the protobuf code generated by
# `tonic::include_proto!` in pkg/api, which cannot be documented by hand and is
# regenerated on every build. pkg/api/src/lib.rs now carries a targeted
# allow(missing_docs) for that module, so the remaining debt is hand-written
# code only and can be burned down incrementally.
missing_docs = "allow"

[workspace.lints.clippy]
# --- Enforced (blocking) -----------------------------------------------------
# `all` plus the three panic-path denials are the safety guarantee stated in
# AGENTS.md Rule #1: keel-init is PID 1 and is compiled with panic = "abort",
# so a panic there aborts PID 1 and the kernel panics with
# "Attempted to kill init".
#
# NOTE: until this commit NONE of these were in effect. `[workspace.lints]`
# only applies to a crate that opts in with `[lints] workspace = true`, and no
# member crate did. `cargo clippy --workspace -- -D warnings` therefore enforced
# only default clippy, and CI was green on an `.unwrap()` in PID 1.
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# --- Staged (not yet blocking) -----------------------------------------------
# TODO(#132): enable these groups one at a time and burn down the fallout.
# Enabling them together produces 400+ findings across the workspace. Landing
# that as a single change would be unreviewable and risks introducing defects
# in the update and boot paths while fixing style nits. They are set to "allow"
# rather than left at "warn" deliberately: CI runs with `-D warnings`, so "warn"
# would block the build, and making CI non-blocking instead would train the team
# to ignore warnings. Explicit debt beats hidden debt.
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }

# Documentation lints, staged with the groups above (34 current violations).
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"


[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort" # Critical for PID 1 robustness and size
